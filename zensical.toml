[project]
site_name = "aiovantage"
site_url = "https://loopj.com/aiovantage"
repo_url = "https://github.com/loopj/aiovantage"
repo_name = "loopj/aiovantage"
edit_uri = "blob/main/docs"
exclude_docs = "requirements.txt"

nav = [
  { "Overview" = "index.md" },
  { "API Reference" = "reference" },
  { "Contributing" = "contributing.md" },
  { "License" = "license.md" },
]

extra_css = ["stylesheets/mkdocstrings.css"]

[project.theme]
variant = "classic"
favicon = "images/favicon.png"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "toc.follow",
]

[project.theme.icon]
logo = "material/alpha-v-box-outline"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent = "lime"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
accent = "lime"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.plugins.api-autonav]
modules = ["src/aiovantage"]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = [
  { url = "https://docs.python.org/3/objects.inv", domains = ["py", "std"] },
]

[project.plugins.mkdocstrings.handlers.python.options]
# General
show_source = false

# Headings
heading_level = 1
show_root_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true

# Members
members_order = "source"
filters = ["!^_"]
summary = true

# Docstrings
docstring_options.ignore_init_summary = true
docstring_section_style = "list"
merge_init_into_class = true
scoped_crossrefs = true

# Signatures
show_signature_annotations = true
separate_signature = true
signature_crossrefs = true

[project.markdown_extensions]
admonition = {}
pymdownx.highlight = {}
pymdownx.magiclink = {}
pymdownx.superfences = {}
pymdownx.snippets.dedent_subsections = true
toc.permalink = true
